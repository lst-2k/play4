  filter:drop-shadow(1px 1px 0 var(--d)) drop-shadow(1px 1px 0 var(--d)) drop-shadow(1px 1px 0 var(--d)) drop-shadow(1px 1px 0 var(--d)) drop-shadow(1px 1px 0 var(--d)) drop-shadow(0 9px 6px rgba(0,0,0,.4));

            title="Menu"

    <!-- Hidden Dropdown Menu (Opens Downward) -->
    <div id="portal-menu-dropdown" style="display: none; margin-top: 10px; background: #061811; border: 2px solid #d4af37; border-radius: 10px; padding: 8px; box-shadow: 0 8px 20px rgba(0,0,0,0.6); min-width: 150px;">

           style="display: flex; align-items: center; justify-content: center; gap: 8px; color: #d4af37; text-decoration: none; font-size: 13px; font-weight: bold; padding: 8px 12px; border-radius: 6px; background: rgba(212, 175, 55, 0.1); transition: background 0.2s;"
           onmouseover="this.style.background='rgba(212, 175, 55, 0.25)'" 
           onmouseout="this.style.background='rgba(212, 175, 55, 0.1)'">
           ← Back to Games

<script>
    function togglePortalMenu() {
        const menu = document.getElementById('portal-menu-dropdown');
        menu.style.display = menu.style.display === 'none' ? 'block' : 'none';
    }

    // Close menu when clicking outside of it
    document.addEventListener('click', function(event) {
        const container = document.getElementById('portal-menu-container');
        if (container && !container.contains(event.target)) {
            document.getElementById('portal-menu-dropdown').style.display = 'none';
        }
    });
</script>

<script>
const C=7,R=6,S=100,P=10,T=110,W=C*S+2*P+20,FH=R*S+2*P,H=T+FH+40,OX=0;
const cv=document.getElementById('cv'),x=cv.getContext('2d');
const COL={1:['#ff7a72','#d41f1f','#8f0f0f'],2:['#fff07a','#f2b600','#9a7000']};
let g,turn,over,win,anim,hover=-1,mode='bot',starter=1,score=[0,0,0],botTimer,swap=false,muted=false,AC,bestOf=3,room=null,me=1,peerHere=false,opp=null,roomCode='',matchWin=0,unsubs=[],oppName='',inMatch=false;
const CL=p=>COL[swap?3-p:p];
const NM=p=>(swap?3-p:p)===1?'Red':'Yellow';
const cx=c=>P+c*S+S/2, cy=r=>T+P+r*S+S/2;
const botTurn=()=>mode==='bot'&&turn===2&&!over;

/* ---- sound ---- */
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,d,v,type,delay=0,f2){
  if(!AC||muted)return;const t=AC.currentTime+delay,o=AC.createOscillator(),gn=AC.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  gn.gain.setValueAtTime(v,t);gn.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(gn).connect(AC.destination);o.start(t);o.stop(t+d+.02);
}
function noise(d,v,fc){
  if(!AC||muted)return;const n=AC.sampleRate*d,b=AC.createBuffer(1,n,AC.sampleRate),a=b.getChannelData(0);
  for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);
  const s=AC.createBufferSource(),f=AC.createBiquadFilter(),gn=AC.createGain();
  s.buffer=b;f.type='bandpass';f.frequency.value=fc;gn.gain.value=v;s.connect(f).connect(gn).connect(AC.destination);s.start();
}
function clink(v){ // plastic counter hitting the stack
  noise(.05,.5*v,3500);
  tone(2300,.16,.22*v,'sine');tone(3450,.12,.14*v,'sine');tone(5100,.08,.07*v,'sine');tone(900,.07,.25*v,'triangle');
}
const tick=()=>{noise(.02,.12,5000);tone(1500,.03,.04,'square')};
function jingle(good){
  const n=good?[523,659,784,1047]:[392,330,262,196];
  n.forEach((f,i)=>tone(f,.28,.18,'triangle',i*.12));
}

/* ---- game ---- */
function reset(){
  clearTimeout(botTimer);
  g=Array.from({length:R},()=>Array(C).fill(0));
  over=false;win=null;anim=null;turn=starter;starter=3-starter;
  status();
  if(botTurn())botTimer=setTimeout(botMove,500);
}
function status0(){
  const dot=document.getElementById('dot'),st=document.getElementById('st');
  if(over){
    if(win){dot.style.background=CL(win.p)[0];st.textContent=mode==='bot'?(win.p===1?'You win!':'Bot wins!'):NM(win.p)+' wins!';}
    else{dot.style.background='#999';st.textContent='It’s a draw';}
    return;
  }
  dot.style.background=CL(turn)[0];
  st.textContent=botTurn()?'Bot is thinking…':(mode==='bot'?'Your turn':NM(turn)+'’s turn');
}
function lowest(c){for(let r=R-1;r>=0;r--)if(!g[r][c])return r;return -1}
function drop(c){
  if(over||anim||c<0||c>=C||lowest(c)<0)return;
  anim={c,r:lowest(c),p:turn,y:45,vy:0,b:0,lr:-1};
  playUI();
  tone(700,.1,.1,'sine',0,300);
}
function land(){
  const {c,r,p}=anim;g[r][c]=p;anim=null;
  const w=findWin(g,p,r,c);
  if(w){over=true;win={p,cells:w};score[p]++;upd();jingle(mode!=='bot'||p===1);}
  else if(g[0].every(v=>v)){over=true;score[0]++;upd();tone(200,.5,.2,'triangle',.1,120);}
  else turn=3-turn;
  status();
  if(botTurn())botTimer=setTimeout(botMove,450);
}
function upd(){
  document.getElementById('sr').textContent=score[swap?2:1];
  document.getElementById('sy').textContent=score[swap?1:2];
  document.getElementById('s0').textContent=score[0];
}
function findWin(b,p,r,c){
  for(const [dr,dc] of [[0,1],[1,0],[1,1],[1,-1]]){
    let cells=[[r,c]];
    for(const s of [1,-1]){
      let rr=r+dr*s,cc=c+dc*s;
      while(rr>=0&&rr<R&&cc>=0&&cc<C&&b[rr][cc]===p){cells.push([rr,cc]);rr+=dr*s;cc+=dc*s}
    }
    if(cells.length>=4)return cells;
  }
  return null;
}
/* ---- bot (always player 2) ---- */
const order=[3,2,4,1,5,0,6];
function evalB(){
  let s=0;
  for(let r=0;r<R;r++)if(g[r][3]===2)s+=3;else if(g[r][3]===1)s-=3;
  const w4=(r,c,dr,dc)=>{
    let a=0,o=0;
    for(let i=0;i<4;i++){const v=g[r+dr*i][c+dc*i];if(v===2)a++;else if(v===1)o++}
    if(a&&o)return 0;
    if(a===3)return 6;if(a===2)return 2;
    if(o===3)return -7;if(o===2)return -2;
    return 0;
  };
  for(let r=0;r<R;r++)for(let c=0;c<C;c++){
    if(c+3<C)s+=w4(r,c,0,1);
    if(r+3<R)s+=w4(r,c,1,0);
    if(r+3<R&&c+3<C)s+=w4(r,c,1,1);
    if(r+3<R&&c-3>=0)s+=w4(r,c,1,-1);
  }
  return s;
}
function mm(d,a,b,max,last){
  if(last&&findWin(g,last.p,last.r,last.c))return last.p===2?100000+d:-100000-d;
  if(g[0].every(v=>v))return 0;
  if(d===0)return evalB();
  let best=max?-Infinity:Infinity;
  for(const c of order){
    const r=lowest(c);if(r<0)continue;
    const p=max?2:1;g[r][c]=p;
    const v=mm(d-1,a,b,!max,{p,r,c});
    g[r][c]=0;
    if(max){if(v>best)best=v;if(v>a)a=v}else{if(v<best)best=v;if(v<b)b=v}
    if(a>=b)break;
  }
  return best;
}
function botMove(){
  if(over||turn!==2)return;
  const depth=+document.getElementById('lv').value;
  const cols=order.filter(c=>lowest(c)>=0);
  let pick;
  if(depth===1&&Math.random()<.3)pick=cols[Math.floor(Math.random()*cols.length)];
  else{
    let best=-Infinity;const sc=[];
    for(const c of cols){
      const r=lowest(c);g[r][c]=2;
      const v=mm(depth-1,-Infinity,Infinity,false,{p:2,r,c});
      g[r][c]=0;sc.push([c,v]);if(v>best)best=v;
    }
    const top=sc.filter(s=>s[1]===best).map(s=>s[0]);
    pick=top[Math.floor(Math.random()*top.length)];
  }
  drop(pick);
}
/* ---- 3D drawing ---- */
function counter(px,py,p,al=1){
  const [a,b,d]=CL(p);
  x.save();x.globalAlpha=al;
  // soft shadow
  x.beginPath();x.arc(px+3,py+5,41,0,7);x.fillStyle='rgba(0,0,0,.28)';x.fill();
  // body with domed shading
  let gr=x.createRadialGradient(px-14,py-16,4,px+4,py+6,48);
  gr.addColorStop(0,a);gr.addColorStop(.55,b);gr.addColorStop(1,d);
  x.beginPath();x.arc(px,py,41,0,7);x.fillStyle=gr;x.fill();
  // bevelled rim
  gr=x.createLinearGradient(px-40,py-40,px+40,py+40);
  gr.addColorStop(0,'rgba(255,255,255,.75)');gr.addColorStop(.5,'rgba(255,255,255,0)');gr.addColorStop(1,'rgba(0,0,0,.55)');
  x.beginPath();x.arc(px,py,38.5,0,7);x.lineWidth=5;x.strokeStyle=gr;x.stroke();
  // recessed inner ring (opposite lighting)
  gr=x.createLinearGradient(px-26,py-26,px+26,py+26);
  gr.addColorStop(0,'rgba(0,0,0,.5)');gr.addColorStop(1,'rgba(255,255,255,.6)');
  x.beginPath();x.arc(px,py,27,0,7);x.lineWidth=4;x.strokeStyle=gr;x.stroke();
